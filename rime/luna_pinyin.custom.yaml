# luna_pinyin.custom.yaml
# 对 luna_pinyin / luna_pinyin_simp 方案的定制
patch:
  # 挂载 lua translator：当输入以大写字母开头且含数字时（如 K8s、A100），
  # 生成「原样 / 全小写 / 全大写」三个候选，可用数字键/空格挑选。
  # recognizer 的 uppercase pattern（默认启用，来自 default.yaml）负责
  # 让大写字母开头的整串被接管，使其中的数字不被当作选词键。

  engine/translators/@next: lua_translator@mixed_case_translator

  # 网址原样输入（twitter.com、https://...、user@example.com 等）
  #
  # 默认 url 规则是 "^[a-z]+[.].+$"：点号后面必须还有字符才算网址。
  # 而按 . 时 Rime 会先把点号放进编码、再判断末尾这个「标点段」要不要顶字上屏；
  # 此刻编码是 "twitter."（点号后暂无字符），匹配不上网址，点号就被当作
  # 标点段并自动上屏「。」（luna_pinyin 的 half_shape 里 '.' 是 {commit: 。}）。
  #
  # 把结尾的 ".+" 放宽为 ".*" 后，"twitter." 一出现就整段被 url 规则接管，
  # 不存在末尾标点段，句号不再自动上屏；继续输入字母会保持原样，
  # 最后按空格/回车整串上屏。
  #
  # 代价：中文句子还没上屏时按 . 也会进入网址状态（Rime 默认行为也是如此）。
  # 要打「。」，先用空格把上一句选上屏，再按 .；或者把下面这行换回默认规则
  # （代价是 twitter.com 又会变成「台湾。」）。
  recognizer/patterns/url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].*$"

  # 让 ü 用 u 或 v 都能打出来（lü/nü、lüe/nüe）
  #
  # - ve → ue：celve/celue、lve/lue、nve/nue 都能命中。
  #   luna_pinyin 自带一条同名的 ve → ue 规则，但带 /correction 标记，
  #   纠错拼写会被降权，所以 celue 的「策略」排在「侧录额」后面；
  #   这里再补一条不带标记的，celue 的「策略」、lue 的「略」、nue 的「虐」
  #   就会排到第一位。
  # - v → u：lv/lu 都能出「吕」，nv/nu 都能出「女」（nu 仍保留「怒」等候选）。
  #
  # 没有加反方向的 u → v（lu/nu → lv/nv），否则「lv」的第一位会变成「路」；
  # 确实需要时自己加一行：- derive/^([nl])u$/$1v/
  "speller/algebra/+":
    - derive/^([nl])ve$/$1ue/
    - derive/^([nl])v$/$1u/

  # 修正标点：# 在 luna_pinyin_simp（经 symbols.yaml 导入）的 half_shape 里被映射成
  # 候选列表 ['#', №]，导致连续输入 ## 时第二个 # 会把候选切换到 № 再上屏。
  # 改为直接输出原样字符，保证 ##、###、#### 等 markdown 标题标记原样输出。
  #
  # 写法说明（关键坑点）：
  # - 不能用路径式 punctuator/half_shape/'#'，Rime 会把引号当作 key 的一部分，
  #   生成字面 key "'#'"，匹配不上真正的 #。
  # - 不能用 {commit: '#'}，与原 list 类型不兼容，会导致整个 schema build 失败。
  # - 正解：用 /+ 后缀把 value 合并进 punctuator（而非整体覆盖），
  #   value 里的 '#' 作为 mapping 子 key 按 YAML 规则解析为标点字符，
  #   以字符串 '#' 整体覆盖原的 ['#', №]。
  punctuator/+:
    half_shape:
      '#': '#'
      # / 原本映射成候选列表 [、, ､, /, ／, ÷]，连按 // 会循环到下一个候选。
      # 改为直接上屏原样 /，保证 //、/// 等 markdown 或代码用法原样输出。
      # 中文顿号「、」仍可由反斜杠 \ 上屏（见 symbols.yaml half_shape 的 \ 映射）。
      '/': '/'
